<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <script>
      window.rootPrefix = /^\/(files|preview)\//.test(location.pathname)
        ? location.pathname.split('/').slice(0, 4).join('/')
        : '/';
    </script>
    <script type="module" src="../webfoundry/ifdesigner.js"></script>
    <script src="../webfoundry/head.js"></script>
  </head>
  <body
    class="flex flex-col [&amp;&gt;div:first-child]:flex-1 min-h-screen"
    style="display: none"
  >
    <div
      class="min-h-screen flex items-center justify-center p-6 overflow-hidden relative desktop:p-0 desktop:items-stretch gfont-[JetBrains_Mono] bg-neutral-950 text-neutral-300 nux:adw-page nux:p-0 nux:items-stretch android:and-body android:p-0 android:items-stretch"
    >
      <div
        class="relative w-full max-w-sm border text-left flex flex-col desktop:max-w-[100vw] desktop:border-0 desktop:shadow-none min-w-min border-neutral-800 bg-neutral-900 rounded-lg overflow-hidden nux:adw-background nux:max-w-none nux:border-0 nux:rounded-none nux:shadow-none android:bg-transparent android:border-0 android:rounded-none android:shadow-none android:max-w-none"
      >
        <div
          class="flex items-center justify-between border-b border-neutral-800 px-3 py-2 text-xs text-neutral-500 nux:adw-header-bar android:and-header android:and-surface android:border-b-0"
        >
          <div class="hidden nux:desktop:flex nux:flex-1 nux:basis-0"></div>
          <span
            class="adw-header-bar-center-box adw-header-bar-title android:and-h6"
            >{{state.counter.title}}</span
          >
          <div
            class="hidden gap-1 desktop:flex nux:desktop:flex-1 nux:basis-0 nux:justify-end nux:items-center nux:gap-1 android:hidden"
          >
            <button
              class="flex h-6 w-6 items-center justify-center rounded text-neutral-500 transition hover:bg-neutral-800 hover:text-neutral-200 nux:adw-button adw-flat adw-circular"
              title="Minimize"
              wf-onclick="post('counter.minimize')"
              value=""
            >
              <span class="nux:hidden">_</span
              ><span
                class="hidden nux:inline-flex nf nf-md-window_minimize"
              ></span>
            </button>
            <button
              class="flex h-6 w-6 items-center justify-center rounded text-neutral-500 transition hover:bg-red-500/80 hover:text-white nux:adw-button adw-flat adw-circular"
              title="Close"
              wf-onclick="post('counter.close')"
              value=""
            >
              <span class="nux:hidden">x</span
              ><span
                class="hidden nux:inline-flex nf nf-md-window_close"
              ></span>
            </button>
          </div>
        </div>
        <div
          class="flex flex-col desktop:flex-1 desktop:justify-center px-6 py-2 nux:flex-1 nux:justify-center android:flex-1 android:justify-center"
        >
          <div
            class="text-7xl font-semibold text-green-400 text-ellipsis overflow-hidden mt-4 mb-6 text-center w-84 nux:adw-accent nux:adw-numeric android:and-h1 android:and-primary-text native:w-full"
          >
            {{state.counter.count}}
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button
              class="rounded border border-neutral-700 py-3 text-2xl text-neutral-200 transition hover:border-green-500 hover:text-green-400 active:translate-y-px nux:adw-button adw-pill android:and-button android:and-large android:and-secondary-container"
              wf-onclick="post('counter.decrement')"
              value=""
            >
              −
            </button>
            <button
              class="rounded border border-neutral-700 py-3 text-2xl text-neutral-200 transition hover:border-green-500 hover:text-green-400 active:translate-y-px nux:adw-button adw-pill adw-suggested-action android:and-button android:and-large"
              wf-onclick="post('counter.increment')"
              value=""
            >
              +
            </button>
          </div>
          <button
            class="mt-3 rounded py-2 text-xs uppercase tracking-widest text-neutral-500 transition hover:text-neutral-200 nux:adw-button adw-flat nux:normal-case nux:tracking-normal android:and-button android:and-border android:normal-case android:tracking-normal"
            wf-onclick="post('counter.reset')"
            value=""
          >
            reset
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
